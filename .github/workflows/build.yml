name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Cache Buildozer
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          android_app/.buildozer
        key: buildozer-cache-v1-${{ hashFiles('android_app/buildozer.spec') }}
        restore-keys: |
          buildozer-cache-v1-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libltdl-dev
        
    - name: Install buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython virtualenv
        
    - name: Build APK
      run: |
        cd android_app
        buildozer android debug 2>&1
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: shengbi-apk
        path: android_app/bin/*.apk
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: android_app/bin/*.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
